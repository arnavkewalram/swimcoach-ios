name: SwimCoach
options:
  bundleIdPrefix: com.arnavkewalram
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  SWIFT_VERSION: "5"
  IPHONEOS_DEPLOYMENT_TARGET: "17.0"
  DEVELOPMENT_TEAM: 4VH58A4KM6
  CODE_SIGN_STYLE: Automatic
  MARKETING_VERSION: 1.12.0
  CURRENT_PROJECT_VERSION: 14

targets:
  SwimCoach:
    type: application
    platform: iOS
    sources:
      - path: SwimCoach
        excludes:
          - "**/.DS_Store"
    dependencies:
      # Weak-linked: only exists in the iOS 26 SDK. CoachingService guards all
      # usage with canImport + availability, so older toolchains still build.
      - sdk: FoundationModels.framework
        weak: true
    resources:
      - path: SwimCoach/Resources/swim_test.mp4
      - path: SwimCoach/Resources/Fonts
    info:
      path: SwimCoach/Info.plist
      properties:
        # XcodeGen's generated plist hardcodes 1.0/1 unless these are mapped
        # to the build settings — without them every install reports 1.0 (1).
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIAppFonts:
          - SpaceGrotesk-Regular.ttf
          - SpaceGrotesk-Medium.ttf
          - SpaceGrotesk-Bold.ttf
        NSCameraUsageDescription: "SwimCoach records swimming videos to analyze your stroke technique."
        NSMicrophoneUsageDescription: "SwimCoach records audio alongside video."
        NSPhotoLibraryUsageDescription: "SwimCoach can analyze swimming videos from your photo library."
        UILaunchScreen:
          UIColorName: LaunchBackground
        # Never expose Documents (users' swim videos live there) via Finder /
        # Files. Dev video staging uses `devicectl device copy` instead.
        UIFileSharingEnabled: false
        LSSupportsOpeningDocumentsInPlace: false
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.arnavkewalram.SwimCoach
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      TARGETED_DEVICE_FAMILY: "1"
      SWIFT_VERSION: "5"

  SwimCoachTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SwimCoachTests
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: SwimCoach
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.arnavkewalram.SwimCoachTests
      SWIFT_VERSION: "5"
      GENERATE_INFOPLIST_FILE: YES
      TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SwimCoach.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/SwimCoach"
      BUNDLE_LOADER: "$(TEST_HOST)"
