name: SwimCoach
options:
  bundleIdPrefix: com.arnavkewalram
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  SWIFT_VERSION: "5"
  IPHONEOS_DEPLOYMENT_TARGET: "17.0"
  DEVELOPMENT_TEAM: NH96D7GY86   # paid Individual team (Rakhi Chhatani); 4VH58A4KM6 was a free Personal Team and cannot publish
  CODE_SIGN_STYLE: Automatic
  MARKETING_VERSION: 1.51.0
  CURRENT_PROJECT_VERSION: 94

targets:
  SwimCoach:
    type: application
    platform: iOS
    sources:
      - path: SwimCoach
        excludes:
          - "**/.DS_Store"
    dependencies:
      # Weak-linked: only exists in the iOS 26 SDK. CoachingService guards all
      # usage with canImport + availability, so older toolchains still build.
      - sdk: FoundationModels.framework
        weak: true
    resources:
      - path: SwimCoach/PrivacyInfo.xcprivacy
      - path: SwimCoach/Resources/swim_test.mp4
      # Real, CC BY 3.0 swimming footage behind "Try a sample swim". Added as
      # a directory, which XcodeGen flattens into the bundle root the same way
      # it does Fonts — load-bearing, because `SampleClip.bundleURL` resolves
      # through `Bundle.main.url(forResource:withExtension:)` (no subdirectory)
      # and `SessionVideoStore.persist` recognises a bundled source by exactly
      # that call. Nested under SampleClips/ they would be copied into the
      # session store on every run instead.
      - path: SwimCoach/Resources/SampleClips
      - path: SwimCoach/Resources/Fonts
    info:
      path: SwimCoach/Info.plist
      properties:
        # XcodeGen's generated plist hardcodes 1.0/1 unless these are mapped
        # to the build settings — without them every install reports 1.0 (1).
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIAppFonts:
          - SpaceGrotesk-Regular.ttf
          - SpaceGrotesk-Medium.ttf
          - SpaceGrotesk-Bold.ttf
        NSCameraUsageDescription: "SwimCoach records swimming videos to analyze your stroke technique."
        # Purpose strings must say what the data is used for, not just that it
        # is captured (App Store Review Guideline 5.1.1). The mic input is
        # optional in CameraManager.configureSession, so this describes the
        # only thing the audio is ever used for.
        NSMicrophoneUsageDescription: "SwimCoach captures audio with your swim recording so poolside coaching notes are still there when you play the clip back or share it. Audio is never analyzed and never leaves your device."
        # No NSPhotoLibraryUsageDescription: importing goes through SwiftUI's
        # .photosPicker, which runs out of process and hands back only the item
        # the user picked. The app never touches PHPhotoLibrary or PHAsset, so
        # declaring library access would ask for a permission it does not use.
        #
        # Nothing is written back to the library either — every export is a
        # ShareLink — so NSPhotoLibraryAddUsageDescription is not needed.

        # Declared so App Store Connect stops asking for export-compliance
        # answers on every single upload. The app makes no network calls at
        # all and ships no cryptography beyond what the OS provides.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        # Never expose Documents (users' swim videos live there) via Finder /
        # Files. Dev video staging uses `devicectl device copy` instead.
        UIFileSharingEnabled: false
        LSSupportsOpeningDocumentsInPlace: false
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.arnavkewalram.SwimCoach
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      TARGETED_DEVICE_FAMILY: "1"
      SWIFT_VERSION: "5"

  SwimCoachUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SwimCoachUITests
    dependencies:
      - target: SwimCoach
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.arnavkewalram.SwimCoachUITests
      SWIFT_VERSION: "5"
      GENERATE_INFOPLIST_FILE: YES
      TEST_TARGET_NAME: SwimCoach

  SwimCoachTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SwimCoachTests
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: SwimCoach
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.arnavkewalram.SwimCoachTests
      SWIFT_VERSION: "5"
      GENERATE_INFOPLIST_FILE: YES
      TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SwimCoach.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/SwimCoach"
      BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  SwimCoach:
    build:
      targets:
        SwimCoach: all
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - SwimCoachTests
        - SwimCoachUITests
    run:
      config: Debug
    archive:
      config: Release
